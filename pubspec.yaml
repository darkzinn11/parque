name: parque
description: Aplicativo de gerenciamento de parques de São Luís - MA
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  intl: ^0.19.0
  lottie: ^3.1.2
  google_maps_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  provider: ^6.0.5
  image_picker: ^1.1.2
  cross_file: ^0.3.5+2
  shared_preferences: ^2.2.2
  http_parser: ^4.1.2
  geolocator: ^13.0.0 # Para o GPS
  permission_handler: ^11.3.1 # Para pedir permissão
  latlong2: ^0.9.1
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  image_gallery_saver: ^2.0.0
  cached_network_image: ^3.3.1
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash_bg.png
    - assets/images/itapiraco.png
    - assets/icons/Map.svg
    - assets/icons/Calendar_Check.svg
    - assets/icons/calendar.svg
    - assets/icons/info.svg
    - assets/images/RANGEDOR.png
    - assets/images/danca.png
    - assets/images/trilha.png
    - assets/images/borboletario.png
    - assets/lottie/heart.json
    - assets/lottie/running.json
    - assets/lottie/success.json
    - assets/images/onboarding1.svg
    - assets/images/onboarding2.svg
    - assets/images/onboarding3.svg
    - assets/images/onboarding4.svg
    - assets/images/success.svg
    - assets/images/logo.svg
    - assets/info/Capa_1.svg
    - assets/info/Capa_2.svg
    - assets/info/Capa_3.svg
    - assets/info/Capa_4.svg
    - assets/info/Capa_5.svg
    - assets/fonts/
    
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/flavicon.png"
  min_sdk_android: 21

flutter_native_splash:
  background_image: assets/images/splash_bg.png
  ios: true
  android: true
  android_12:
    background_image: assets/images/splash_bg.png
    image: assets/icons/flavicon.png

fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic